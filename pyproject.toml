[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-hsu"
version = "0.1.0"
description = "Simple HSU chatbot with Vietnamese normalization and reranking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "scikit-learn>=1.3,<2.0",
  "numpy>=1.26,<3.0",
  "python-dotenv>=1.0,<2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
